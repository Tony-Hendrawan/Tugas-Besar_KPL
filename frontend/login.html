<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Masuk — GoletKos</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/auth.css" />
        <link rel="icon" href="images/search.png" type="image/png" />
    </head>
    <body>
        <main class="auth-page">
            <div class="auth-card">
                <a href="index.html" class="auth-brand">
                    <img src="images/logo.png" alt="GoletKos Logo" />
                    <span>GoletKos</span>
                </a>
                <h1 class="auth-title">Masuk ke Akun</h1>
                <p class="auth-subtitle">Selamat datang kembali!</p>
                <div id="loginAlert"></div>
                <form id="loginForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input
                            class="form-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nama@email.com"
                            required
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password"
                            >Password</label
                        >
                        <input
                            class="form-input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            required
                            autocomplete="current-password"
                        />
                    </div>
                    <button
                        type="submit"
                        class="btn-primary"
                        style="width: 100%; padding: 0.875rem"
                    >
                        Masuk
                    </button>
                </form>
                <p class="auth-footer">
                    Belum punya akun?
                    <a href="register.html" class="auth-link"
                        >Daftar sekarang</a
                    >
                </p>
            </div>
        </main>
        <script src="js/utils.ts"></script>
        <script src="js/api.ts"></script>
        <script src="js/auth.ts"></script>
    </body>
</html>
