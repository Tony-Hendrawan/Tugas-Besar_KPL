<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daftar — GoletKos</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/auth.css" />
        <link rel="icon" href="images/search.png" type="image/png" />
    </head>
    <body>
        <main class="auth-page">
            <div class="auth-card">
                <a href="index.html" class="auth-brand">
                    <img src="images/logo.png" alt="GoletKos Logo" />
                    <span>GoletKos</span>
                </a>
                <h1 class="auth-title">Buat Akun Baru</h1>
                <p class="auth-subtitle">Bergabung dengan GoletKos sekarang</p>
                <div id="registerAlert"></div>
                <form id="registerForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="fullname"
                            >Nama Lengkap</label
                        >
                        <input
                            class="form-input"
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Nama lengkap Anda"
                            required
                            autocomplete="name"
                        />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input
                            class="form-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nama@email.com"
                            required
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password"
                            >Password</label
                        >
                        <input
                            class="form-input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimal 6 karakter"
                            required
                            autocomplete="new-password"
                        />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="no_telepon"
                            >No. Telepon</label
                        >
                        <input
                            class="form-input"
                            type="tel"
                            id="no_telepon"
                            name="no_telepon"
                            placeholder="08xxxxxxxxxx"
                            autocomplete="tel"
                        />
                    </div>
                    <button
                        type="submit"
                        class="btn-primary"
                        style="width: 100%; padding: 0.875rem"
                    >
                        Daftar
                    </button>
                </form>
                <p class="auth-footer">
                    Sudah punya akun?
                    <a href="login.html" class="auth-link">Masuk di sini</a>
                </p>
            </div>
        </main>
        <script src="js/utils.ts"></script>
        <script src="js/api.ts"></script>
        <script src="js/auth.ts"></script>
    </body>
