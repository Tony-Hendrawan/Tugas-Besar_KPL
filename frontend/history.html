<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Riwayat Booking — GoletKos</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/kos.css" />
        <link rel="icon" href="images/search.png" type="image/png" />
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar-container">
                <a href="index.html" class="navbar-brand"
                    ><img src="images/logo.png" alt="GoletKos Logo" /><span
                        class="navbar-brand-text"
                        >GoletKos</span
                    ></a
                >
                <button
                    class="navbar-toggle"
                    id="navbarToggle"
                    aria-label="Toggle navigation"
                >
                    ☰
                </button>
                <div class="navbar-menu" id="navbarMenu">
                    <ul class="navbar-links">
                        <li>
                            <a href="index.html" class="nav-link">Beranda</a>
                        </li>
                        <li>
                            <a href="kos-list.html" class="nav-link"
                                >Cari Kos</a
                            >
                        </li>
                        <li>
                            <a href="compare.html" class="nav-link"
                                >Bandingkan</a
                            >
                        </li>
                    </ul>
                    <div style="display: flex; gap: 0.5rem">
                        <a
                            href="login.html"
                            class="btn-outline"
                            style="padding: 0.5rem 1.25rem"
                            >Masuk</a
                        ><a
                            href="register.html"
                            class="btn-primary"
                            style="padding: 0.5rem 1.25rem"
                            >Daftar</a
                        >
                    </div>
                </div>
            </div>
        </nav>

        <main class="section">
            <div class="section-container">
                <div class="history-container">
                    <div class="section-header">
                        <h1 class="section-title">Riwayat Booking</h1>
                        <p class="section-subtitle">
                            Kelola dan pantau semua booking Anda
                        </p>
                    </div>
                    <div
                        id="bookingStats"
                        class="stats-grid"
                        style="display: none"
                    >
                        <div class="stat-card">
                            <div class="stat-value" id="statTotal">0</div>
                            <div class="stat-label">Total</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="statPending">0</div>
                            <div class="stat-label">Menunggu</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="statConfirmed">0</div>
                            <div class="stat-label">Dikonfirmasi</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="statCancelled">0</div>
                            <div class="stat-label">Dibatalkan</div>
                        </div>
                    </div>
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">
                            Semua
                        </button>
                        <button class="filter-tab" data-filter="pending">
                            Menunggu
                        </button>
                        <button class="filter-tab" data-filter="confirmed">
                            Dikonfirmasi
                        </button>
                        <button class="filter-tab" data-filter="completed">
                            Selesai
                        </button>
                        <button class="filter-tab" data-filter="cancelled">
                            Dibatalkan
                        </button>
                    </div>
                    <div id="bookingHistory" class="booking-list">
                        <p
                            style="
                                text-align: center;
                                padding: 3rem 0;
                                color: var(--gray-500);
                            "
                        >
                            Memuat riwayat booking...
                        </p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-container">
                <div class="footer-bottom">
                    <p>&copy; 2026 GoletKos. All rights reserved.</p>
                </div>
            </div>
        </footer>

        <script src="js/utils.ts"></script>
        <script src="js/api.ts"></script>
        <script src="js/auth.ts"></script>
        <script src="js/booking.ts"></script>
    </body>
</html>
